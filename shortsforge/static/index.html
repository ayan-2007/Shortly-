          </div>
          <a class="btn-dl" href="${esc(o.video_url)}" download="${esc(o.output_video)}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Short (.mp4)
          </a>
        </div>
        <div>
          <div style="margin-bottom:12px;">
            <div style="font-size:16px; font-weight:800; color:var(--sky-bright); display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
              <span>${esc(o.clip_id.toUpperCase())} &mdash; ${esc(o.hook_text)}</span>
              <span class="badge coral">CAPTIONS: ${esc(posBadge)}</span>
              ${o.attention_card_enabled ? `<span class="badge green">WHITE BOX CARD: ON</span>` : ""}
              ${activeFiltersList.length ? `<span class="badge sky">FILTERS: ${esc(activeFiltersList.join(" + "))}</span>` : ""}
            </div>
            <div style="font-size:12px; color:var(--muted); margin-top:3px;">${esc(o.output_video)} &bull; ${fmtTime(o.start)}-${fmtTime(o.end)} (${Math.round((o.end || 0) - (o.start || 0))}s) &bull; Active-Speaker Face Tracked</div>
          </div>

          <!-- Post-Render Interactive Live Video Editor for this Short -->
          <div class="clip-editor-box" data-clip-editor="${cid}">
            <div class="clip-editor-head">
              <div class="clip-editor-title">
                <span class="neon-dot"></span>
                Live Video Editor &mdash; Runtime Filters, Caption Position &amp; Center White Box
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn-secondary" id="ed-reset-${cid}" type="button" style="padding:6px 12px; font-size:11.5px;">Reset Preview</button>
                <button class="shiny-cta shiny-coral" id="ed-save-${cid}" type="button" style="padding:0.50rem 1.05rem; font-size:0.78rem;">
                  <span>Apply &amp; Save to This Video &rarr;</span>
                </button>
              </div>
            </div>

            <!-- 1. Instant Click-to-Preview Filter Pills -->
            <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:5px;">
              1. Click Filter to Preview Live on Video Player (Decide Before Saving)
            </div>
            <div class="filter-pills-row" id="ed-pills-${cid}">
              <button type="button" class="filter-pill-btn" data-fpill="">Original (No Filter)</button>
              <button type="button" class="filter-pill-btn" data-fpill="cinematic_grade">Cinematic Grade</button>
              <button type="button" class="filter-pill-btn" data-fpill="sharp_hd">Crisp Sharp HD</button>
              <button type="button" class="filter-pill-btn" data-fpill="warm_studio">Warm Studio</button>
              <button type="button" class="filter-pill-btn" data-fpill="vibrant_pop">Vibrant Pop</button>
              <button type="button" class="filter-pill-btn" data-fpill="denoise_clean">Studio Denoise</button>
              <button type="button" class="filter-pill-btn" data-fpill="cool_documentary">Cool Documentary</button>
              <button type="button" class="filter-pill-btn" data-fpill="bw_noir">B&amp;W Noir</button>
            </div>

            <!-- 2. Caption Position, Style, Color & Dual Filter Controls -->
            <div class="editor-controls-grid">
              <div class="opt-field">
                <label for="ed-cappos-${cid}">2. Caption Position</label>
                <select id="ed-cappos-${cid}">
                  ${CAPTION_POSITION_OPTIONS_HTML}
                </select>
              </div>
              <div class="opt-field">
                <label for="ed-cappreset-${cid}">Caption Style</label>
                <select id="ed-cappreset-${cid}">
                  <option value="iman">Iman Gadzhi Kinetic</option>
                  <option value="hormozi">Alex Hormozi Impact</option>
                  <option value="documentary">Documentary Editorial</option>
                  <option value="neon">Neon Bold</option>
                  <option value="comic">Comic Punch</option>
                  <option value="minimal">Clean Minimal</option>
                </select>
              </div>
              <div class="opt-field">
                <label for="ed-capcolor-${cid}">Caption Color</label>
                <select id="ed-capcolor-${cid}">
                  <option value="purple">Neon Purple</option>
                  <option value="yellow">Luxury Gold / Yellow</option>
                  <option value="red">Viral Crimson Red</option>
                </select>
              </div>
              <div class="opt-field">
                <label for="ed-f1-${cid}">Filter Layer 1</label>
                <select id="ed-f1-${cid}">
                  ${FILTER_OPTIONS_HTML}
                </select>
              </div>
              <div class="opt-field">
                <label for="ed-f2-${cid}">Filter Layer 2</label>
                <select id="ed-f2-${cid}">
                  ${FILTER_OPTIONS_HTML}
                </select>
              </div>
              <label class="toggle-chip" id="ed-mirror-chip-${cid}" style="justify-content:space-between; height:35px; padding:5px 11px;">
                <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;">
                  <input type="checkbox" id="ed-mirror-${cid}" />
                  Mirror
                </span>
                <span class="toggle-state" id="ed-mirror-state-${cid}">OFF</span>
              </label>
            </div>

            <!-- 3. White Box in the Center with Attention-Grabbing Text -->
            <div class="attn-editor-row">
              <label class="toggle-chip" id="ed-attn-chip-${cid}" style="height:35px; padding:5px 12px;">
                <input type="checkbox" id="ed-attn-on-${cid}" />
                <span>3. Center White Box Card</span>
                <span class="toggle-state" id="ed-attn-state-${cid}">OFF</span>
              </label>
              <input type="text" class="attn-input" id="ed-attn-txt-${cid}" value="${esc(defaultCardText)}" placeholder="Type attention-grabbing text for the white center box..." />
              <div class="opt-field">
                <select id="ed-attn-pos-${cid}" title="Card Position" style="height:35px;">
                  <option value="center">Center of Screen</option>
                  <option value="upper">Upper-Center</option>
                  <option value="lower">Lower-Center</option>
                </select>
              </div>
              <div class="opt-field">
                <select id="ed-attn-dur-${cid}" title="Card Duration" style="height:35px;">
                  <option value="4">First 4s (Intro)</option>
                  <option value="7">First 7s</option>
                  <option value="0">Entire Video</option>
                  <option value="3">First 3s</option>
                </select>
              </div>
              <div class="opt-field">
                <select id="ed-attn-style-${cid}" title="Card Style" style="height:35px;">
                  <option value="white_box">Classic White Box</option>
                  <option value="white_pill">White Pill Badge</option>
                  <option value="dark_neon">Dark Neon Box</option>
                </select>
              </div>
            </div>
          </div>

          ${o.post_caption ? `
          <div class="meta-block">
            <h4>Ready-to-Post Social Caption <button class="copy-mini" data-copy="${esc(o.post_caption)}" type="button">Copy Caption</button></h4>
            <div class="copy-box">${esc(o.post_caption)}</div>
          </div>` : ""}
          <div class="meta-block">
            <h4>5 Video-Specific Titles</h4>
            <ul class="title-list">
              ${(o.titles || []).map((t, ti) => `<li><span>${ti + 1}. ${esc(t)}</span><button class="copy-mini" data-copy="${esc(t)}" type="button">Copy</button></li>`).join("")}
            </ul>
          </div>
          <div class="meta-block">
            <h4>Description (Source Credited) <button class="copy-mini" data-copy="${esc(o.description)}" type="button">Copy</button></h4>
            <div class="copy-box">${esc(o.description)}</div>
          </div>
          <div class="meta-block">
            <h4>${(o.hashtags || []).length} Topic Hashtags <button class="copy-mini" data-copy="${esc((o.hashtags || []).join(" "))}" type="button">Copy All</button></h4>
            <div class="tags-wrap">${(o.hashtags || []).map(h => `<span class="tag-chip">${esc(h)}</span>`).join("")}</div>
          </div>
          <div class="meta-block">
            <h4>Pinned Comment Question <button class="copy-mini" data-copy="${esc(o.pinned_comment)}" type="button">Copy</button></h4>
            <div class="copy-box">${esc(o.pinned_comment)}</div>
          </div>
        </div>
      </div>
    `;
    }).join("");
  }

  document.getElementById("content").innerHTML = bodyHtml;
  bindJobBannerActions();

  const prefs = loadPrefs();
  const oPreset = document.getElementById("o-cap-preset");
  const oColor = document.getElementById("o-cap-color");
  const oPos = document.getElementById("o-cap-position");
  const oF1 = document.getElementById("o-filter-1");
  const oF2 = document.getElementById("o-filter-2");
  if (oPreset) oPreset.value = prefs.preset || "iman";
  if (oColor) oColor.value = prefs.color || "purple";
  if (oPos) oPos.value = prefs.position || "bottom";
  if (oF1) oF1.value = prefs.filter1 || "";
  if (oF2) oF2.value = prefs.filter2 || "";

  const oMirrorCb = document.getElementById("o-mirror-video");
  const oMirrorChip = document.getElementById("o-mirror-chip");
  const oMirrorState = document.getElementById("o-mirror-state");
  if (oMirrorCb) {
    oMirrorCb.checked = !!prefs.mirror;
    oMirrorChip.classList.toggle("is-on", oMirrorCb.checked);
    oMirrorState.textContent = oMirrorCb.checked ? "ON" : "OFF";
    const persistOutPrefs = () => savePrefs({
      preset: oPreset.value,
      color: oColor.value,
      position: oPos.value,
      filter1: oF1.value,
      filter2: oF2.value,
      mirror: oMirrorCb.checked,
    });
    [oPreset, oColor, oPos, oF1, oF2].forEach(el => el && el.addEventListener("change", persistOutPrefs));
    oMirrorCb.addEventListener("change", () => {
      oMirrorChip.classList.toggle("is-on", oMirrorCb.checked);
      oMirrorState.textContent = oMirrorCb.checked ? "ON" : "OFF";
      persistOutPrefs();
    });
  }

  // Bind Per-Clip Interactive Live Video Editors
  outputs.forEach(o => {
    const cid = o.clip_id;
    const vidEl = document.getElementById(`vid-${cid}`);
    const badgeEl = document.getElementById(`live-badge-${cid}`);
    const attnOverlayEl = document.getElementById(`live-attn-${cid}`);
    const attnBoxEl = document.getElementById(`live-attn-box-${cid}`);
    const attnTxtPreviewEl = document.getElementById(`live-attn-txt-${cid}`);
    const capGuideEl = document.getElementById(`live-cap-guide-${cid}`);
    const capPillEl = document.getElementById(`live-cap-pill-${cid}`);

    const capPosSel = document.getElementById(`ed-cappos-${cid}`);
    const capPresetSel = document.getElementById(`ed-cappreset-${cid}`);
    const capColorSel = document.getElementById(`ed-capcolor-${cid}`);
    const f1Sel = document.getElementById(`ed-f1-${cid}`);
    const f2Sel = document.getElementById(`ed-f2-${cid}`);
    const mirrorCb = document.getElementById(`ed-mirror-${cid}`);
    const mirrorChip = document.getElementById(`ed-mirror-chip-${cid}`);
    const mirrorState = document.getElementById(`ed-mirror-state-${cid}`);

    const attnOnCb = document.getElementById(`ed-attn-on-${cid}`);
    const attnChip = document.getElementById(`ed-attn-chip-${cid}`);
    const attnState = document.getElementById(`ed-attn-state-${cid}`);
    const attnTxtIn = document.getElementById(`ed-attn-txt-${cid}`);
    const attnPosSel = document.getElementById(`ed-attn-pos-${cid}`);
    const attnDurSel = document.getElementById(`ed-attn-dur-${cid}`);
    const attnStyleSel = document.getElementById(`ed-attn-style-${cid}`);
    const pillsRow = document.getElementById(`ed-pills-${cid}`);

    if (!vidEl || !capPosSel) return;

    const savedState = {
      caption_position: o.caption_position || "bottom",
      caption_preset: o.caption_preset || "iman",
      caption_color: o.caption_color || "purple",
      f1: (o.video_filters && o.video_filters[0]) || "",
      f2: (o.video_filters && o.video_filters[1]) || "",
      mirror: !!o.mirror_video,
      attn_on: !!o.attention_card_enabled,
      attn_txt: o.attention_card_text || o.hook_text || "",
      attn_pos: o.attention_card_position || "center",
      attn_dur: String(o.attention_card_duration !== undefined ? Math.round(o.attention_card_duration) : 4),
      attn_style: o.attention_card_style || "white_box",
    };

    function loadSavedIntoInputs() {
      capPosSel.value = savedState.caption_position;
      capPresetSel.value = savedState.caption_preset;
      capColorSel.value = savedState.caption_color;
      f1Sel.value = savedState.f1;
      f2Sel.value = savedState.f2;
      mirrorCb.checked = savedState.mirror;
      mirrorChip.classList.toggle("is-on", mirrorCb.checked);
      mirrorState.textContent = mirrorCb.checked ? "ON" : "OFF";

      attnOnCb.checked = savedState.attn_on;
      attnChip.classList.toggle("is-on", attnOnCb.checked);
      attnState.textContent = attnOnCb.checked ? "ON" : "OFF";
      attnTxtIn.value = savedState.attn_txt;
      attnPosSel.value = savedState.attn_pos;
      attnDurSel.value = ["0", "3", "4", "7"].includes(savedState.attn_dur) ? savedState.attn_dur : "4";
      attnStyleSel.value = savedState.attn_style;
      updateLivePreview(false);
    }

    function updateLivePreview(showGuideOnPosChange = true) {
      const curF1 = f1Sel.value;
      const curF2 = f2Sel.value;
      const curMirror = mirrorCb.checked;
      const curCapPos = capPosSel.value;
      const curAttnOn = attnOnCb.checked;
      const curAttnTxt = attnTxtIn.value.trim() || o.hook_text || "WAIT FOR THIS...";
      const curAttnPos = attnPosSel.value;
      const curAttnDur = parseFloat(attnDurSel.value) || 0;
      const curAttnStyle = attnStyleSel.value;

      // Sync pill button highlight with Filter Layer 1
      if (pillsRow) {
        pillsRow.querySelectorAll(".filter-pill-btn").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.fpill === curF1);
        });
      }

      mirrorChip.classList.toggle("is-on", curMirror);
      mirrorState.textContent = curMirror ? "ON" : "OFF";
      attnChip.classList.toggle("is-on", curAttnOn);
      attnState.textContent = curAttnOn ? "ON" : "OFF";

      // Compute unbaked CSS filter preview for filters not already baked into the MP4 file
      const bakedSet = new Set([savedState.f1, savedState.f2].filter(Boolean));
      const chosenList = [curF1, curF2].filter(Boolean);
      const cssParts = [];
      chosenList.forEach(fk => {
        if (!bakedSet.has(fk) && LIVE_FILTER_CSS_MAP[fk]) {
          cssParts.push(LIVE_FILTER_CSS_MAP[fk]);
        }
      });
      vidEl.style.filter = cssParts.length ? cssParts.join(" ") : "none";
      vidEl.style.transform = (curMirror !== savedState.mirror) ? "scaleX(-1)" : "none";

      // Live White Box Center Attention Card Overlay (shown whenever card is enabled & either unbaked or modified)
      const attnModified =
        curAttnOn !== savedState.attn_on ||
        curAttnTxt !== savedState.attn_txt ||
        curAttnPos !== savedState.attn_pos ||
        String(curAttnDur) !== savedState.attn_dur ||
        curAttnStyle !== savedState.attn_style;

      const withinTime = curAttnDur <= 0 || vidEl.paused || vidEl.currentTime <= curAttnDur;
      if (curAttnOn && (!savedState.attn_on || attnModified) && withinTime) {
        attnOverlayEl.className = "live-attn-overlay active " + (
          curAttnPos === "center" && curCapPos === "center" ? "pos-center-offset" : `pos-${curAttnPos}`
        );
        attnBoxEl.className = `live-attn-box style-${curAttnStyle}`;
        attnTxtPreviewEl.textContent = curAttnTxt;
      } else {
        attnOverlayEl.classList.remove("active");
      }

      // Live Caption Position Guide Overlay
      const capPosChanged = curCapPos !== savedState.caption_position;
      if (showGuideOnPosChange && capPosChanged) {
        capGuideEl.className = `live-cap-guide active pos-${curCapPos}`;
        capPillEl.textContent = `New Caption Position: ${curCapPos.toUpperCase().replace("_", " ")}`;
      } else {
        capGuideEl.classList.remove("active");
      }

      const anyDirty =
        curF1 !== savedState.f1 ||
        curF2 !== savedState.f2 ||
        curMirror !== savedState.mirror ||
        capPosChanged ||
        capPresetSel.value !== savedState.caption_preset ||
        capColorSel.value !== savedState.caption_color ||
        attnModified;

      badgeEl.classList.toggle("active", anyDirty);
    }

    if (pillsRow) {
      pillsRow.querySelectorAll(".filter-pill-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          f1Sel.value = btn.dataset.fpill || "";
          if (!f1Sel.value) f2Sel.value = "";
          updateLivePreview(true);
        });
      });
    }

    [capPosSel, capPresetSel, capColorSel, f1Sel, f2Sel, mirrorCb, attnOnCb, attnPosSel, attnDurSel, attnStyleSel].forEach(el => {
      el.addEventListener("change", () => updateLivePreview(true));
    });
    attnTxtIn.addEventListener("input", () => {
      if (!attnOnCb.checked && attnTxtIn.value.trim()) {
        attnOnCb.checked = true;
      }
      updateLivePreview(true);
    });
    vidEl.addEventListener("timeupdate", () => updateLivePreview(false));
    vidEl.addEventListener("pause", () => updateLivePreview(false));

    document.getElementById(`ed-reset-${cid}`).addEventListener("click", () => {
      loadSavedIntoInputs();
      showToast(`Reset ${cid.toUpperCase()} preview to current saved video.`);
    });

    document.getElementById(`ed-save-${cid}`).addEventListener("click", async () => {
      try {
        const chosenFilters = [f1Sel.value, f2Sel.value].filter(Boolean);
        const job = await apiPost("/api/jobs/edit-clip", {
          name: p.name,
          clip_id: cid,
          caption_preset: capPresetSel.value,
          active_color: capColorSel.value,
          caption_position: capPosSel.value,
          mirror_video: mirrorCb.checked,
          video_filters: chosenFilters,
          attention_card_enabled: attnOnCb.checked,
          attention_card_text: attnTxtIn.value.trim() || o.hook_text || "",
          attention_card_position: attnPosSel.value,
          attention_card_duration: parseFloat(attnDurSel.value) || 0,
          attention_card_style: attnStyleSel.value,
        });
        showToast(`Baking edits into ${cid.toUpperCase()}...`);
        startPollingJob(job);
      } catch (e) { showToast(e.message); }
    });

    loadSavedIntoInputs();
  });

  async function triggerOutputRender(autoMode) {
    try {
      const oFilters = [
        document.getElementById("o-filter-1").value,
        document.getElementById("o-filter-2").value,
      ].filter(Boolean);
      const job = await apiPost("/api/jobs/render", {
        name: p.name,
        auto: autoMode,
        force: true,
        hook_enabled: false,
        show_opening_title: false,
        caption_preset: document.getElementById("o-cap-preset").value,
        active_color: document.getElementById("o-cap-color").value,
        caption_position: document.getElementById("o-cap-position").value,
        mirror_video: document.getElementById("o-mirror-video").checked,
        video_filters: oFilters,
      });
      startPollingJob(job);
    } catch (e) { showToast(e.message); }
  }

  const openBtn = document.getElementById("btn-open-out");
  if (openBtn) openBtn.addEventListener("click", () => apiPost("/api/open-folder", { project_name: p.name }));
  const reBtn = document.getElementById("btn-rerender-outputs");
  if (reBtn) reBtn.addEventListener("click", () => triggerOutputRender(false));
  const renBtn = document.getElementById("btn-render-now");
  if (renBtn) renBtn.addEventListener("click", () => triggerOutputRender(true));
  document.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", () => copyText(btn.dataset.copy));
  });
}

function renderMain() {
  if (APP.view === "new") renderNewProjectView();
  else renderProjectView();
}

function goHome() {
  APP.view = "new";
  renderSidebar();
  renderMain();
}

document.getElementById("btn-nav-new").addEventListener("click", goHome);
document.getElementById("logo-home").addEventListener("click", goHome);
document.getElementById("project-tabs").querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    APP.tab = btn.dataset.tab;
    renderProjectView();
  });
});

(async function init() {
  await loadProjectsList();
  try {
    const jdata = await apiGet("/api/jobs");
    const running = (jdata.jobs || []).find(j => j.status === "running");
    if (running) {
      startPollingJob(running);
      return;
    }
  } catch (_) {}
  renderMain();
})();
</script>
</body>
</html>
