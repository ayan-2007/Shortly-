<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shortly Studio — Viral Shorts Generator</title>
<link rel="icon" type="image/png" href="/static/shortly-pulse.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /* === Shiny CTA Houdini Custom Properties === */
  @property --gradient-angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  @property --gradient-angle-offset {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  @property --gradient-percent {
    syntax: "<percentage>";
    initial-value: 5%;
    inherits: false;
  }
  @property --gradient-shine {
    syntax: "<color>";
    initial-value: #FBF3E7;
    inherits: false;
  }

  :root {
    /* Shortly Brand + Pulse Bar Slitted Glass Palette */
    --bg-deep: #0E1724;
    --bg-slate: #1E2532;
    --navy-pulse: #123A6B;
    --sky: #229BF0;
    --sky-bright: #49B8FF;
    --coral-fire: #F26A3E;
    --coral-pulse: #E4676B;
    --ibis-pink: #F4B3C2;
    --cream: #FBF3E7;

    --sidebar-bg: rgba(13, 21, 35, 0.78);
    --topbar-bg: rgba(13, 21, 35, 0.68);
    --glass-panel: rgba(18, 28, 45, 0.74);
    --glass-panel-strong: rgba(15, 24, 39, 0.86);
    --glass-panel-soft: rgba(25, 38, 60, 0.62);
    --glass-border: rgba(251, 243, 231, 0.14);
    --glass-border-strong: rgba(244, 179, 194, 0.30);

    --text: #F7F8FC;
    --text-soft: #C6D4E8;
    --muted: #93A6C4;
    --green: #22C55E;
    --red: #F43F5E;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #123A6B;
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* === Full-Bleed Animated Pulse Bar Slitted Glass Canvas Background === */
  #pulse-bg-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  /* Subtle dark-slate atmospheric scrim so the Pulse Bar glass glows cleanly behind crisp readable UI */
  .bg-scrim {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 85% 65% at 55% 18%, rgba(34, 155, 240, 0.12), transparent 65%),
      radial-gradient(ellipse 75% 60% at 80% 85%, rgba(242, 106, 62, 0.14), transparent 68%),
      linear-gradient(180deg, rgba(14, 23, 36, 0.30) 0%, rgba(16, 24, 38, 0.48) 55%, rgba(12, 19, 31, 0.68) 100%);
  }

  /* App Shell sits above canvas + scrim */
  aside, .main-wrap {
    position: relative;
    z-index: 2;
  }

  /* Custom sleek scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(251, 243, 231, 0.18);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(242, 106, 62, 0.55); }

  /* === ShinyButton (adapted from shiny-button.tsx for Shortly) === */
  .shiny-cta {
    --shiny-cta-bg: #0D1626;
    --shiny-cta-bg-subtle: #1D2D46;
    --shiny-cta-fg: #FBF3E7;
    --shiny-cta-highlight: #229BF0;
    --shiny-cta-highlight-subtle: #F26A3E;
    --animation: gradient-angle linear infinite;
    --duration: 3s;
    --shadow-size: 2px;
    --transition: 800ms cubic-bezier(0.25, 1, 0.5, 1);

    isolation: isolate;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    outline-offset: 4px;
    padding: 0.92rem 1.85rem;
    font-family: "Inter", sans-serif;
    font-size: 0.98rem;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.01em;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--shiny-cta-fg);
    background:
      linear-gradient(var(--shiny-cta-bg), var(--shiny-cta-bg)) padding-box,
      conic-gradient(
        from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
        transparent,
        var(--shiny-cta-highlight) var(--gradient-percent),
        var(--gradient-shine) calc(var(--gradient-percent) * 2),
        var(--shiny-cta-highlight-subtle) calc(var(--gradient-percent) * 3),
        transparent calc(var(--gradient-percent) * 4)
      ) border-box;
    box-shadow:
      inset 0 0 0 1px var(--shiny-cta-bg-subtle),
      0 10px 28px rgba(8, 15, 29, 0.45);
    transition: var(--transition);
    transition-property: --gradient-angle-offset, --gradient-percent, --gradient-shine, transform, box-shadow;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
  }

  .shiny-cta.shiny-coral {
    --shiny-cta-bg: #141927;
    --shiny-cta-bg-subtle: #2F2436;
    --shiny-cta-highlight: #F26A3E;
    --shiny-cta-highlight-subtle: #F4B3C2;
  }

  .shiny-cta.shiny-sm {
    padding: 0.72rem 1.25rem;
    font-size: 0.875rem;
    width: 100%;
  }

  .shiny-cta::before,
  .shiny-cta::after,
  .shiny-cta > span::before {
    content: "";
    pointer-events: none;
    position: absolute;
    inset-inline-start: 50%;
    inset-block-start: 50%;
    translate: -50% -50%;
    z-index: -1;
  }

  .shiny-cta:active {
    translate: 0 1px;
  }

  /* Dot matrix pattern */
  .shiny-cta::before {
    --size: calc(100% - var(--shadow-size) * 3);
    --position: 2px;
    --space: calc(var(--position) * 2);
    width: var(--size);
    height: var(--size);
    background: radial-gradient(
      circle at var(--position) var(--position),
      rgba(251, 243, 231, 0.9) calc(var(--position) / 4),
      transparent 0
    ) padding-box;
    background-size: var(--space) var(--space);
    background-repeat: space;
    mask-image: conic-gradient(
      from calc(var(--gradient-angle) + 45deg),
      black,
      transparent 10% 90%,
      black
    );
    -webkit-mask-image: conic-gradient(
      from calc(var(--gradient-angle) + 45deg),
      black,
      transparent 10% 90%,
      black
    );
    border-radius: inherit;
    opacity: 0.38;
    z-index: -1;
  }

  /* Inner shimmer sweep */
  .shiny-cta::after {
    --animation: shimmer linear infinite;
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(
      -50deg,
      transparent,
      var(--shiny-cta-highlight),
      transparent
    );
    mask-image: radial-gradient(circle at bottom, transparent 40%, black);
    -webkit-mask-image: radial-gradient(circle at bottom, transparent 40%, black);
    opacity: 0.55;
  }

  .shiny-cta > span {
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .shiny-cta > span::before {
    --size: calc(100% + 1rem);
    width: var(--size);
    height: var(--size);
    box-shadow: inset 0 -1ex 2rem 4px var(--shiny-cta-highlight);
    opacity: 0;
    transition: opacity var(--transition);
    animation: calc(var(--duration) * 1.5) breathe linear infinite;
  }

  .shiny-cta,
  .shiny-cta::before,
  .shiny-cta::after {
    animation:
      var(--animation) var(--duration),
      var(--animation) calc(var(--duration) / 0.4) reverse paused;
    animation-composition: add;
  }

  .shiny-cta:is(:hover, :focus-visible) {
    --gradient-percent: 20%;
    --gradient-angle-offset: 95deg;
    --gradient-shine: var(--shiny-cta-highlight-subtle);
    box-shadow:
      inset 0 0 0 1px rgba(251, 243, 231, 0.25),
      0 12px 34px rgba(34, 155, 240, 0.28),
      0 0 22px rgba(242, 106, 62, 0.22);
  }

  .shiny-cta:is(:hover, :focus-visible),
  .shiny-cta:is(:hover, :focus-visible)::before,
  .shiny-cta:is(:hover, :focus-visible)::after {
    animation-play-state: running;
  }

  .shiny-cta:is(:hover, :focus-visible) > span::before {
    opacity: 1;
  }

  @keyframes gradient-angle {
    to { --gradient-angle: 360deg; }
  }
  @keyframes shimmer {
    to { rotate: 360deg; }
  }
  @keyframes breathe {
    from, to { scale: 1; }
    50% { scale: 1.2; }
  }

  /* === Glass Secondary & Utility Buttons === */
  button {
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.1s ease, box-shadow 0.16s ease;
  }
  button:active { transform: scale(0.98); }

  .btn-glass {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0.85rem 1.35rem;
    border-radius: 999px;
    background: rgba(18, 30, 49, 0.72);
    color: var(--cream);
    border: 1px solid var(--glass-border);
    font-weight: 600;
    font-size: 0.9rem;
    backdrop-filter: blur(14px);
    white-space: nowrap;
  }
  .btn-glass:hover {
    background: rgba(34, 155, 240, 0.16);
    border-color: rgba(34, 155, 240, 0.55);
    box-shadow: 0 6px 20px rgba(34, 155, 240, 0.18);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 10px 16px;
    border-radius: 11px;
    background: rgba(24, 37, 59, 0.76);
    color: var(--text);
    border: 1px solid var(--glass-border);
    font-weight: 600;
    font-size: 13px;
    backdrop-filter: blur(12px);
  }
  .btn-secondary:hover {
    background: rgba(34, 155, 240, 0.18);
    border-color: rgba(34, 155, 240, 0.5);
  }

  .btn-approve {
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    background: rgba(34, 197, 94, 0.12);
    color: #86EFAC;
    border: 1px solid rgba(34, 197, 94, 0.42);
  }
  .btn-approve.active {
    background: linear-gradient(135deg, #22C55E, #16A34A);
    color: #03210E;
    border-color: transparent;
  }
  .btn-reject {
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    background: rgba(244, 63, 94, 0.12);
    color: #FDA4AF;
    border: 1px solid rgba(244, 63, 94, 0.42);
  }
  .btn-reject.active {
    background: linear-gradient(135deg, #F43F5E, #E11D48);
    color: #FFFFFF;
    border-color: transparent;
  }

  /* === Sidebar === */
  aside {
    width: 280px;
    min-width: 264px;
    background: var(--sidebar-bg);
    backdrop-filter: blur(26px) saturate(140%);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-shadow: 8px 0 36px rgba(6, 12, 24, 0.35);
  }

  .logo {
    padding: 18px 18px 16px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }
  .logo-img-wrap {
    width: 48px;
    height: 36px;
    border-radius: 10px;
    background: rgba(30, 37, 50, 0.85);
    border: 1px solid rgba(34, 155, 240, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(34, 155, 240, 0.16);
  }
  .logo-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .logo-wordmark {
    margin: 0;
    font-family: "Plus Jakarta Sans", "Inter", sans-serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--sky);
    line-height: 1.05;
  }
  .logo .ver {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.01em;
  }

  .sidebar-actions {
    padding: 14px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .section-lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding: 10px 16px 6px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .project-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .proj-item {
    position: relative;
    padding: 11px 30px 11px 12px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
  }
  .proj-del {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    display: grid;
    place-items: center;
    opacity: 0;
    padding: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .proj-item:hover .proj-del { opacity: 1; }
  .proj-del:hover { background: rgba(244, 63, 94, 0.22); color: #FDA4AF; }
  .btn-stop {
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(244, 63, 94, 0.18);
    color: #FDA4AF;
    border: 1px solid rgba(244, 63, 94, 0.5);
    font-size: 12px;
    font-weight: 700;
  }
  .btn-stop:hover { background: rgba(244, 63, 94, 0.34); color: #fff; }
  .btn-dl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin-top: 10px;
    padding: 9px 14px;
    border-radius: 10px;
    background: rgba(34, 155, 240, 0.16);
    color: #BAE6FD;
    border: 1px solid rgba(34, 155, 240, 0.42);
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-dl:hover { background: rgba(34, 155, 240, 0.30); border-color: rgba(34, 155, 240, 0.7); }
  .proj-item:hover {
    background: rgba(34, 155, 240, 0.10);
    border-color: rgba(34, 155, 240, 0.25);
  }
  .proj-item.active {
    background: linear-gradient(135deg, rgba(34, 155, 240, 0.20), rgba(242, 106, 62, 0.14));
    border-color: rgba(34, 155, 240, 0.55);
    box-shadow: 0 6px 20px rgba(10, 18, 32, 0.35);
  }
  .proj-item .pname { font-weight: 700; font-size: 13.5px; color: var(--cream); }
  .proj-item .pmeta {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .proj-badges { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }

  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(18, 28, 45, 0.8);
    border: 1px solid var(--glass-border);
    color: var(--text-soft);
    letter-spacing: 0.02em;
  }
  .badge.green {
    color: #86EFAC;
    border-color: rgba(34, 197, 94, 0.45);
    background: rgba(34, 197, 94, 0.14);
  }
  .badge.coral {
    color: #FFD3C4;
    border-color: rgba(242, 106, 62, 0.50);
    background: rgba(242, 106, 62, 0.18);
  }
  .badge.sky {
    color: #BAE6FD;
    border-color: rgba(34, 155, 240, 0.48);
    background: rgba(34, 155, 240, 0.16);
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .sidebar-footer img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex-shrink: 0;
  }

  /* === Main Workspace === */
  .main-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    padding: 14px 28px;
    border-bottom: 1px solid var(--glass-border);
    background: var(--topbar-bg);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .topbar h2 {
    margin: 0;
    font-family: "Plus Jakarta Sans", "Inter", sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--cream);
  }
  .topbar .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    padding: 8px 15px;
    border-radius: 999px;
    background: rgba(22, 34, 54, 0.72);
    color: var(--text-soft);
    border: 1px solid var(--glass-border);
    font-weight: 600;
    font-size: 13px;
  }
  .tab-btn:hover {
    border-color: rgba(34, 155, 240, 0.5);
    color: #fff;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--sky), #1778D0);
    color: #FFFFFF;
    border-color: rgba(251, 243, 231, 0.35);
    box-shadow: 0 4px 16px rgba(34, 155, 240, 0.34);
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 56px;
  }

  /* === Animated Hero Section (adapted from animated-hero.tsx for Shortly) === */
  .hero-shell {
    max-width: 940px;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 12px 12px 8px;
  }

  .hero-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px 7px 10px;
    border-radius: 999px;
    background: rgba(16, 26, 44, 0.76);
    border: 1px solid rgba(251, 243, 231, 0.18);
    backdrop-filter: blur(18px);
    color: var(--cream);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    box-shadow: 0 8px 26px rgba(8, 16, 30, 0.35);
    margin-bottom: 16px;
  }
  .hero-pill img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    display: block;
  }
  .hero-pill .pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--coral-fire);
    box-shadow: 0 0 10px var(--coral-fire);
  }

  .hero-brand-lockup {
    margin-bottom: 10px;
  }
  .hero-brand-lockup img {
    height: 70px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 12px 26px rgba(10, 18, 34, 0.55));
  }

  .hero-title {
    margin: 0;
    font-family: "Plus Jakarta Sans", "Inter", sans-serif;
    font-size: clamp(2.35rem, 5vw, 3.95rem);
    line-height: 1.08;
    letter-spacing: -0.04em;
    font-weight: 700;
    max-width: 780px;
    color: #EFF7FF;
  }

  .hero-title .lead-line {
    display: block;
    font-weight: 600;
    color: rgba(235, 246, 255, 0.96);
    text-shadow: 0 6px 28px rgba(10, 20, 38, 0.45);
  }

  .hero-rotator {
    position: relative;
    display: flex;
    width: 100%;
    justify-content: center;
    overflow: hidden;
    height: 1.32em;
    margin-top: 2px;
  }

  .hero-word {
    position: absolute;
    left: 0;
    right: 0;
    font-weight: 800;
    background: linear-gradient(92deg, #56C2FF 0%, #229BF0 26%, #F26A3E 64%, #FBF3E7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 4px 18px rgba(8, 18, 36, 0.55));
    transform: translateY(150%);
    opacity: 0;
    transition:
      transform 680ms cubic-bezier(0.22, 1.32, 0.36, 1),
      opacity 420ms ease;
    will-change: transform, opacity;
  }
  .hero-word.is-active {
    transform: translateY(0%);
    opacity: 1;
  }
  .hero-word.is-past {
    transform: translateY(-150%);
    opacity: 0;
  }
  .hero-word.is-future {
    transform: translateY(150%);
    opacity: 0;
  }

  .hero-sub {
    margin: 12px auto 22px;
    max-width: 640px;
    font-size: clamp(0.96rem, 1.35vw, 1.08rem);
    line-height: 1.58;
    color: rgba(235, 242, 252, 0.88);
    font-weight: 400;
  }

  /* === Slitted-Glass Studio Command Dock (Link Input + Options) === */
  .studio-dock {
    width: 100%;

  .link-bar {

  .opts-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(251, 243, 231, 0.14), transparent);
    margin: 18px 0 16px;
  }

  .quick-opts {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    font-size: 12px;
    color: var(--text-soft);
  }
  @media (max-width: 1180px) {
    .quick-opts { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
  }

  .opt-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .opt-field label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .opt-field select {
    padding: 8px 11px;
    border-radius: 10px;

    transition: border-color 0.15s;

  .opt-field select:focus {
    border-color: var(--sky);

  .quick-toggles {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(251, 243, 231, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }

  .toggle-group {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .toggle-chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 14px;

    background: rgba(11, 18, 30, 0.72);

    border-color: rgba(34, 155, 240, 0.55);

  .toggle-chip.is-on {

    box-shadow: 0 0 18px rgba(192, 75, 255, 0.22);
  }
  .toggle-chip input {
    accent-color: #C84BFF;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .toggle-state {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 999px;

  .enhance-panel {

  .enhance-panel-title {
    font-size: 13px;
    font-weight: 800;

    align-items: center;
    gap: 8px;

  .enhance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));

  .feature-strip {
    max-width: 920px;

  .feature-card {
    background: rgba(15, 24, 39, 0.62);

  .feature-card .ft-head {
    display: flex;

    margin: 0;
    font-size: 12px;
    line-height: 1.48;
    color: var(--muted);

  /* === Frosted Glass Panels === */
  .panel {
    background: var(--glass-panel);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 12px 34px rgba(6, 12, 24, 0.32);

  /* === Live Job Banner === */
  .job-banner {
    max-width: 880px;

  }
  .job-logs {
    margin-top: 10px;
    background: rgba(7, 11, 19, 0.88);
    border: 1px solid rgba(251, 243, 231, 0.12);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11.5px;
    color: #CBD5E1;

    overflow-y: auto;
    white-space: pre-wrap;

  /* === Candidate Review Cards === */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(490px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--glass-panel-strong);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;

    display: flex;
    flex-direction: column;
    box-shadow: 0 14px 36px rgba(6, 12, 24, 0.36);
  }
  .card.approved { border-color: rgba(34, 197, 94, 0.65); }
  .card.rejected { opacity: 0.72; }
  .card-top { display: grid; grid-template-columns: 184px 1fr; gap: 14px; padding: 15px; }
  .thumb-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #070B14;
    aspect-ratio: 16/10;
    border: 1px solid rgba(251, 243, 231, 0.10);
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .score-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(12, 20, 34, 0.90);
    color: #FFD3C4;
    border: 1px solid rgba(242, 106, 62, 0.60);
    border-radius: 8px;
    padding: 3px 8px;
    font-weight: 800;
    font-size: 12.5px;
  }
  .time-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(6, 11, 20, 0.85);
    color: #fff;
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
  }
  .quote {
    font-size: 12.5px;
    font-style: italic;
    background: rgba(25, 39, 62, 0.65);
    border-left: 3px solid var(--coral-fire);
    padding: 8px 11px;
    border-radius: 8px;
    margin-top: 7px;
    color: var(--cream);
  }
  .hook-section {
    padding: 12px 15px 14px;
    border-top: 1px solid var(--glass-border);
    background: rgba(11, 18, 31, 0.65);
  }
  .hook-section input, .hook-section select {
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--glass-border);
    background: rgba(8, 14, 24, 0.86);
    color: #fff;
    font-size: 13px;
  }
  .hook-section input:focus, .hook-section select:focus {
    outline: none;
    border-color: var(--sky);
  }
  .card-actions {
    display: flex;
    gap: 10px;
    padding: 12px 15px;
    border-top: 1px solid var(--glass-border);
    background: rgba(10, 16, 28, 0.72);
  }
  .card-actions button { flex: 1; }

  /* === Outputs Player Cards & Live Runtime Video Editor === */
  .output-card {
    background: var(--glass-panel-strong);
    backdrop-filter: blur(22px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 24px;
    box-shadow: 0 18px 46px rgba(6, 12, 24, 0.42);
  }
  .video-shell {
    position: relative;
    background: #060910;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(251, 243, 231, 0.16);
    aspect-ratio: 9 / 16;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .video-shell video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: filter 0.18s ease, transform 0.18s ease;
  }
  .live-preview-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(200, 75, 255, 0.75);
    color: #F3E8FF;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
  }
  .live-preview-badge.active { display: inline-flex; }

  /* Live On-Video White Box Center Attention Card Preview */
  .live-attn-overlay {
    position: absolute;
    left: 14px;
    right: 14px;
    z-index: 5;
    display: none;
    justify-content: center;
    pointer-events: none;
    transform: translateY(-50%);
    transition: top 0.18s ease, opacity 0.18s ease;
  }
  .live-attn-overlay.active { display: flex; }
  .live-attn-overlay.pos-center { top: 46%; }
  .live-attn-overlay.pos-center-offset { top: 36%; }
  .live-attn-overlay.pos-upper { top: 24%; }
  .live-attn-overlay.pos-lower { top: 70%; }

  .live-attn-box {
    background: rgba(255, 255, 255, 0.97);
    color: #0E1016;
    border-radius: 12px;
    padding: 11px 15px 10px;
    text-align: center;
    font-family: "Plus Jakarta Sans", "Inter", sans-serif;
    font-weight: 800;
    font-size: 13.5px;
    line-height: 1.28;
    letter-spacing: -0.01em;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.58);
    border: 1.5px solid rgba(226, 232, 240, 0.95);
    max-width: 94%;
    word-break: break-word;
  }
  .live-attn-box .attn-bar {
    width: 46px;
    height: 3.5px;
    border-radius: 99px;
    background: #8A22E2;
    margin: 0 auto 6px;
  }
  .live-attn-box.style-white_pill {
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 12.5px;
  }
  .live-attn-box.style-white_pill .attn-bar { display: none; }
  .live-attn-box.style-dark_neon {
    background: rgba(14, 16, 26, 0.95);
    color: #FFFFFF;
    border: 2px solid #C04BFF;
    box-shadow: 0 0 18px rgba(192, 75, 255, 0.4), 0 10px 24px rgba(0, 0, 0, 0.6);
  }
  .live-attn-box.style-dark_neon .attn-bar { background: #D876FF; }

  /* Live On-Video Caption Position Guide */
  .live-cap-guide {
    position: absolute;
    left: 16px;
    right: 16px;
    z-index: 5;
    display: none;
    justify-content: center;
    pointer-events: none;
    transform: translateY(-50%);
    transition: top 0.18s ease;
  }
  .live-cap-guide.active { display: flex; }
  .live-cap-guide.pos-bottom { top: 78%; }
  .live-cap-guide.pos-lower_mid { top: 65%; }
  .live-cap-guide.pos-center { top: 50%; }
  .live-cap-guide.pos-upper_mid { top: 35%; }
  .live-cap-guide.pos-top { top: 22%; }
  .live-cap-pill {
    padding: 6px 14px;
    border-radius: 10px;
    background: rgba(16, 10, 28, 0.86);
    border: 1.5px dashed #C84BFF;
    color: #F5D0FE;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
  }

  /* Post-Render Editor Panel inside each Output Card */
  .clip-editor-box {
    background: linear-gradient(135deg, rgba(16, 26, 44, 0.90), rgba(26, 19, 44, 0.86));
    border: 1px solid rgba(200, 75, 255, 0.34);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(5, 10, 20, 0.35);
  }
  .clip-editor-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid rgba(251, 243, 231, 0.10);
  }
  .clip-editor-title {
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #E9D5FF;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .filter-pills-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 11px;
  }
  .filter-pill-btn {
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    background: rgba(11, 18, 30, 0.78);
    color: var(--text-soft);
    border: 1px solid rgba(251, 243, 231, 0.14);

  .filter-pill-btn:hover {
    border-color: rgba(34, 155, 240, 0.55);
    color: #fff;
  }
  .filter-pill-btn.active {
    background: linear-gradient(135deg, rgba(200, 75, 255, 0.30), rgba(34, 155, 240, 0.28));
    border-color: #C84BFF;
    color: #FFFFFF;
    box-shadow: 0 0 12px rgba(200, 75, 255, 0.28);
  }
  .editor-controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 9px;
    align-items: end;
  }
  .attn-editor-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(251, 243, 231, 0.09);
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 8px;
    align-items: center;
  }
  @media (max-width: 1150px) {
    .attn-editor-row { grid-template-columns: 1fr 1fr; }
  }
  .attn-input {
    width: 100%;
    padding: 8px 11px;
    border-radius: 9px;
    border: 1px solid rgba(251, 243, 231, 0.18);
    background: rgba(8, 13, 23, 0.88);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
  }
  .attn-input:focus {
    outline: none;
    border-color: #C84BFF;
  }
  .meta-block { margin-bottom: 14px; }
  .meta-block h4 {
    margin: 0 0 6px;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .title-list li {
    background: rgba(24, 37, 58, 0.66);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 8px 11px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .copy-mini {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    background: rgba(34, 155, 240, 0.14);
    color: #BAE6FD;
    border: 1px solid rgba(34, 155, 240, 0.38);
  }
  .copy-mini:hover {
    background: rgba(34, 155, 240, 0.28);
  }
  .copy-box {
    background: rgba(24, 37, 58, 0.66);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    white-space: pre-wrap;
    color: var(--cream);
  }
  .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chip {
    background: rgba(34, 155, 240, 0.14);
    color: #BAE6FD;
    border: 1px solid rgba(34, 155, 240, 0.36);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
  }

  /* === Toast === */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 26px;
    background: rgba(15, 24, 40, 0.94);
    backdrop-filter: blur(18px);
    color: var(--cream);
    border: 1px solid rgba(34, 155, 240, 0.65);
    box-shadow: 0 12px 32px rgba(5, 10, 22, 0.55);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 960px) {
    body { flex-direction: column; overflow: auto; }
    aside { width: 100%; height: auto; min-width: 0; border-right: none; border-bottom: 1px solid var(--glass-border); }
    .main-wrap { height: auto; overflow: visible; }
    .output-card { grid-template-columns: 1fr; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<!-- Animated Pulse Bar Slitted Glass Canvas Background -->
<canvas id="pulse-bg-canvas" aria-hidden="true"></canvas>

</aside>

<div class="main-wrap">

<script>
/* ============================================================================
 * 1. Animated "Pulse bar slitted glass" Canvas Background
 *    Palette: #123A6B (Navy) @ 0%, #E4676B (Coral) @ 63%,
 *             #F4B3C2 (Ibis pink) @ 91%, #FBF3E7 (Cream) @ 100%
 *    Motion:  ph = t * 0.17, amt = 0.35, dir = 1, spin = ph * dir
 *             Zero snap at ph = 0 (sin(x + p) - sin(p) / cos(x) - 1)
 *             No Math.round quantization per frame.
 * ========================================================================== */
(function initPulseBarSlittedGlass() {
  const canvas = document.getElementById("pulse-bg-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d", { alpha: false });
  if (!ctx) return;

  const CFG = {
    mode: "bars",
    colors: [
      { id: "c9_21849", hex: "#123A6B", rgb: [18, 58, 107], pos: 0, name: "Navy" },
      { id: "c10_57610", hex: "#E4676B", rgb: [228, 103, 107], pos: 63, name: "Coral" },
      { id: "c11_93371", hex: "#F4B3C2", rgb: [244, 179, 194], pos: 91, name: "Ibis pink" },
      { id: "c12_29132", hex: "#FBF3E7", rgb: [251, 243, 231], pos: 100, name: "Cream" },
    ],
    angle: 90,
    centerX: 50,
    centerY: 50,
    scale: 68,
    softness: 29,
    wave: 0,
    distortion: 28,
    grain: 0,
    vignette: 13,
    count: 6,
    fade: 25,
    envelope: "ramp",
    spread: -22,
    soften: 0,
    animated: true,
    speed: 17,
    motionAmount: 35,
    motionReverse: false,
    seed: 239191696,
    backdrop: "#123A6B",
    backdropRgb: [18, 58, 107],
  };

  // Seeded PRNG (mulberry32) for deterministic per-bar organic phase offsets
  function makeRng(seed) {
    let a = seed >>> 0;
    return function() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rng = makeRng(CFG.seed);
  const barMeta = [];
  for (let i = 0; i < CFG.count; i++) {
    barMeta.push({
      phaseA: rng() * Math.PI * 2,
      phaseB: rng() * Math.PI * 2,
      freqA: 1.55 + rng() * 0.85,
      freqB: 0.75 + rng() * 0.55,
      // Cycle palette across the 6 bars (Navy -> Coral -> Ibis pink -> Cream -> Navy -> Coral)
      colorIdx: i % CFG.colors.length,
      nextColorIdx: (i + 1) % CFG.colors.length,
    });
  }

  // Offscreen buffer for soft bar composition before vertical slitted-glass refraction
  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d", { alpha: false });

  let viewW = 1280;
  let viewH = 720;
  let bufW = 640;
  let bufH = 360;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(viewW * dpr));
    canvas.height = Math.max(1, Math.floor(viewH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Smooth internal buffer for bar glow & slitted glass sampling
    bufW = Math.max(360, Math.min(820, Math.floor(viewW * 0.55)));
    bufH = Math.max(220, Math.min(520, Math.floor(viewH * 0.55)));
    off.width = bufW;
    off.height = bufH;
  }

  function rgbaStr(rgb, a) {
    return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
  }

  function lerpRgb(c1, c2, u) {
    return [
      c1[0] + (c2[0] - c1[0]) * u,
      c1[1] + (c2[1] - c1[1]) * u,
      c1[2] + (c2[2] - c1[2]) * u,
    ];
  }

  function samplePalette(u) {
    const p = ((u % 1) + 1) % 1 * 100;
    const cols = CFG.colors;
    for (let i = 0; i < cols.length - 1; i++) {
      if (p >= cols[i].pos && p <= cols[i + 1].pos) {
        const span = Math.max(1e-5, cols[i + 1].pos - cols[i].pos);
        return lerpRgb(cols[i].rgb, cols[i + 1].rgb, (p - cols[i].pos) / span);
      }
    }
    return cols[cols.length - 1].rgb;
  }

  const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const startTime = performance.now();

  function renderFrame(now) {
    const t = reducedMotion ? 0 : (now - startTime) * 0.001;
    const ph = t * (CFG.speed / 100);       // t * 0.17
    const amt = CFG.motionAmount / 100;     // 0.35
    const dir = CFG.motionReverse ? -1 : 1; // 1
    const spin = ph * dir;

    // 1) Fill backdrop on offscreen canvas
    offCtx.fillStyle = CFG.backdrop;
    offCtx.fillRect(0, 0, bufW, bufH);

    // 2) Draw the 6 ramp-envelope pulse bars with smooth unquantized motion
    const count = CFG.count;
    const spreadFrac = CFG.spread / 100;    // -0.22 (negative spread -> lush overlap)
    const scaleFrac = CFG.scale / 100;      // 0.68
    const fadeFrac = CFG.fade / 100;        // 0.25
    const distFrac = CFG.distortion / 100;  // 0.28

    // Total span and individual bar width (strictly floating-point, zero Math.round!)
    const slotW = bufW / count;
    const barW = slotW * (1 - spreadFrac * 1.65);

    // Smooth global envelope shimmer (strictly 0 at ph = 0)
    const globalShift = (Math.cos(spin * 0.85) - 1) * amt * 0.09;

    // Soft blur proportional to softness (29)
    const blurPx = (CFG.softness / 100) * Math.min(bufW, bufH) * 0.115;
    offCtx.save();
    offCtx.filter = `blur(${blurPx}px)`;

    for (let i = 0; i < count; i++) {
      const m = barMeta[i];
      const normIdx = i / Math.max(1, count - 1); // 0 .. 1

      // Ramp envelope: rises steadily across the 6 bars
      const envBase = 0.44 + normIdx * 0.52;

      // Envelope clock shimmer — strictly 0 at ph = 0!
      const envMod =
        (Math.sin(spin * m.freqA + m.phaseA) - Math.sin(m.phaseA)) * amt * 0.30 +
        (Math.cos(spin * m.freqB + m.phaseB) - Math.cos(m.phaseB)) * amt * 0.16 +
        globalShift;

      const heightRatio = Math.max(0.24, Math.min(1.12, (envBase + envMod) * (0.78 + scaleFrac * 0.44)));
      const barH = bufH * heightRatio;

      // Continuous horizontal breathing drift (strictly 0 at ph = 0)
      const driftX = (Math.sin(spin * 1.1 + m.phaseB) - Math.sin(m.phaseB)) * amt * slotW * 0.26;
      const cx = (i + 0.5) * slotW + driftX;
      const x0 = cx - barW * 0.5;

      // Center Y shifted subtly along ramp + vertical pulse (strictly 0 at ph = 0)
      const driftY = (Math.cos(spin * 0.95 + m.phaseA) - Math.cos(m.phaseA)) * amt * bufH * 0.07;
      const cy = bufH * (CFG.centerY / 100) + (0.5 - normIdx) * bufH * 0.08 + driftY;
      const y0 = cy - barH * 0.5;
      const y1 = cy + barH * 0.5;

      // Smooth color shimmer along the exact 4-stop palette (0 shift at ph = 0)
      const colorShift = (Math.sin(spin * 0.65 + i * 0.7) - Math.sin(i * 0.7)) * amt * 0.14;
      const basePos = (i / count) + colorShift;
      const barRgb = lerpRgb(CFG.colors[m.colorIdx].rgb, samplePalette(basePos + 0.22), 0.35);
      const peakRgb = lerpRgb(barRgb, CFG.colors[m.nextColorIdx].rgb, 0.28);

      // Vertical bar gradient fading toward backdrop (#123A6B) at top & bottom by `fade`
      const vGrad = offCtx.createLinearGradient(cx, y0, cx, y1);
      vGrad.addColorStop(0.0, rgbaStr(CFG.backdropRgb, 0.0));
      vGrad.addColorStop(Math.min(0.45, fadeFrac * 0.85), rgbaStr(barRgb, 0.92));
      vGrad.addColorStop(0.52, rgbaStr(peakRgb, 0.98));
      vGrad.addColorStop(Math.max(0.55, 1.0 - fadeFrac * 0.85), rgbaStr(barRgb, 0.88));
      vGrad.addColorStop(1.0, rgbaStr(CFG.backdropRgb, 0.0));

      offCtx.fillStyle = vGrad;
      offCtx.fillRect(x0, y0, barW, barH);
    }
    offCtx.restore();

    // Soft top-to-bottom backdrop fade (25% fade)
    const fadeGrad = offCtx.createLinearGradient(0, 0, 0, bufH);
    fadeGrad.addColorStop(0, "rgba(18, 58, 107, 0.26)");
    fadeGrad.addColorStop(0.5, "rgba(18, 58, 107, 0.04)");
    fadeGrad.addColorStop(1, "rgba(18, 58, 107, 0.28)");
    offCtx.fillStyle = fadeGrad;
    offCtx.fillRect(0, 0, bufW, bufH);

    // 3) Composite onto display canvas with Slitted Glass fluted vertical refraction
    ctx.fillStyle = CFG.backdrop;
    ctx.fillRect(0, 0, viewW, viewH);

    const slitCount = Math.max(28, Math.min(72, Math.floor(viewW / 24)));
    const slitW = viewW / slitCount;
    const srcSlitW = bufW / slitCount;
    const refractAmp = distFrac * srcSlitW * 1.45;
    const wavePhase = (Math.sin(spin * 0.9) - 0) * amt * 1.25; // strictly 0 at ph = 0

    for (let s = 0; s < slitCount; s++) {
      const dx = s * slitW;
      const u = s / slitCount;
      // Optical flute refraction offset (smooth, zero quantization)
      const refract = Math.sin(u * Math.PI * 6 + wavePhase) * refractAmp;
      const sx = Math.max(0, Math.min(bufW - srcSlitW, s * srcSlitW + refract));
      ctx.drawImage(off, sx, 0, srcSlitW, bufH, dx, 0, slitW + 0.65, viewH);
    }

    // Fine vertical slitted-glass specular sheen & flute grooves
    const glassOverlay = ctx.createLinearGradient(0, 0, viewW, 0);
    for (let s = 0; s < slitCount; s++) {
      const a = s / slitCount;
      const mid = (s + 0.18) / slitCount;
      const b = (s + 0.96) / slitCount;
      glassOverlay.addColorStop(Math.min(1, a), "rgba(251, 243, 231, 0.045)");
      glassOverlay.addColorStop(Math.min(1, mid), "rgba(251, 243, 231, 0.0)");
      glassOverlay.addColorStop(Math.min(1, b), "rgba(10, 20, 42, 0.09)");
    }
    ctx.fillStyle = glassOverlay;
    ctx.fillRect(0, 0, viewW, viewH);

    // 4) Vignette (vignette: 13)
    const cxView = viewW * (CFG.centerX / 100);
    const cyView = viewH * (CFG.centerY / 100);
    const outerR = Math.hypot(viewW, viewH) * 0.56;
    const vig = ctx.createRadialGradient(cxView, cyView, outerR * 0.42, cxView, cyView, outerR);
    vig.addColorStop(0, "rgba(0, 0, 0, 0)");
    vig.addColorStop(1, `rgba(6, 14, 28, ${(CFG.vignette / 100) * 2.2})`);
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, viewW, viewH);

    if (CFG.animated && !reducedMotion) {
      requestAnimationFrame(renderFrame);
    }
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(renderFrame);
})();

/* ============================================================================
 * 2. Shortly Studio SPA State & API Logic
 * ========================================================================== */
const APP = {
  view: "new",
  tab: "outputs",
  projects: [],
  currentProjectName: null,
  currentProject: null,
  activeJob: null,
  pollTimer: null,
  heroTimer: null,
};

const HERO_WORDS = ["viral shorts", "effortless", "cinematic", "magnetic", "unstoppable"];

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2300);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); showToast("Copied to clipboard!"); }
  catch (_) { showToast("Select text to copy"); }
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

async function apiGet(url) {
  const res = await fetch(url);
  return res.json();
}

async function apiPost(url, data) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data || {}),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

async function loadProjectsList() {
  const data = await apiGet("/api/projects");
  APP.projects = data.projects || [];
  renderSidebar();
}

const LIVE_FILTER_CSS_MAP = {
  cinematic_grade: "contrast(1.09) saturate(1.15) brightness(1.02)",
  sharp_hd: "contrast(1.06) brightness(1.01) saturate(1.04)",
  denoise_clean: "brightness(1.02) contrast(1.02) saturate(1.03)",
  warm_studio: "sepia(0.15) saturate(1.16) contrast(1.05) brightness(1.01)",
  vibrant_pop: "contrast(1.13) saturate(1.30) brightness(1.03)",
  cool_documentary: "hue-rotate(-8deg) contrast(1.11) saturate(0.92)",
  bw_noir: "grayscale(1) contrast(1.24) brightness(1.02)",
};

const FILTER_OPTIONS_HTML = `
  <option value="">None (Original)</option>
  <option value="cinematic_grade">Cinematic Color &amp; Contrast</option>
  <option value="sharp_hd">Crisp HD Detail &amp; Sharpen</option>
  <option value="warm_studio">Warm Studio &amp; Vignette</option>
  <option value="vibrant_pop">Vibrant Viral Pop</option>
  <option value="denoise_clean">Studio Denoise &amp; Cleanup</option>
  <option value="cool_documentary">Cool Documentary Grade</option>
  <option value="bw_noir">High-Contrast B&amp;W Noir</option>
`;

  <option value="center">Exact Center (Middle of Screen)</option>
  <option value="lower_mid">Lower-Middle</option>
  <option value="upper_mid">Upper-Middle</option>
  <option value="top">Top Safe Zone</option>
`;

function loadPrefs() {
  try {
    return Object.assign(
      {
        preset: "iman",
        color: "purple",
        position: "bottom",
        filter1: "",
        filter2: "",
        mirror: false,
        maxClips: "12",
      },
      JSON.parse(localStorage.getItem("shortly_prefs_v1") || "{}")
    );
  } catch (_) {
    return {
      preset: "iman",
      color: "purple",
      position: "bottom",
      filter1: "",
      filter2: "",
      mirror: false,
      maxClips: "12",
    };
  }
}

function savePrefs(partial) {
  try {
    const merged = Object.assign(loadPrefs(), partial);
    localStorage.setItem("shortly_prefs_v1", JSON.stringify(merged));
  } catch (_) {}
}

function renderSidebar() {
  const list = document.getElementById("project-list");
  const countPill = document.getElementById("proj-count-pill");
  if (countPill) countPill.textContent = String(APP.projects.length);

  if (!APP.projects.length) {
    list.innerHTML = `<div style="padding:14px 12px;font-size:12px;color:var(--muted);line-height:1.5;">No projects yet. Paste a YouTube link or browse a video on the right to start.</div>`;
    return;
  }

  list.innerHTML = APP.projects.map(p => {
    const active = APP.view === "project" && APP.currentProjectName === p.name ? "active" : "";
    return `
      <div class="proj-item ${active}" data-proj="${esc(p.name)}" role="button" tabindex="0">
        <button class="proj-del" data-del="${esc(p.name)}" type="button" title="Delete project">&times;</button>
        <div class="pname">${esc(p.person || p.name)}</div>
        <div class="pmeta">${esc(p.title || p.show_name || p.name)}</div>
        <div class="proj-badges">
          ${p.rendered_count ? `<span class="badge green">${p.rendered_count} Shorts Ready</span>` : `<span class="badge coral">${p.candidate_count} viral picks</span>`}
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".proj-item").forEach(item => {
    item.addEventListener("click", ev => {
      if (ev.target && ev.target.closest(".proj-del")) return;
      openProject(item.dataset.proj);
    });
  });

  list.querySelectorAll(".proj-del").forEach(btn => {
    btn.addEventListener("click", async ev => {
      ev.stopPropagation();
      const pname = btn.dataset.del;
      if (!confirm(`Delete project "${pname}" and its rendered Shorts?`)) return;
      try {
        await apiPost(`/api/projects/${encodeURIComponent(pname)}/delete`, {});
        showToast("Project deleted.");
        if (APP.currentProjectName === pname) {
          APP.currentProjectName = null;
          APP.currentProject = null;
          APP.view = "new";
        }
        await loadProjectsList();
        renderMain();
      } catch (e) { showToast(e.message); }
    });
  });
}

async function openProject(name, tabOverride) {
  if (APP.heroTimer) {
    clearInterval(APP.heroTimer);
    APP.heroTimer = null;
  }
  APP.view = "project";
  APP.currentProjectName = name;
  APP.currentProject = await apiGet(`/api/projects/${encodeURIComponent(name)}`);
  if (tabOverride) {
    APP.tab = tabOverride;
  } else if (APP.currentProject.outputs && APP.currentProject.outputs.length > 0) {
    APP.tab = "outputs";
  } else {
    APP.tab = "review";
  }
  renderSidebar();
  renderMain();
}

function renderJobBannerHtml() {
  const j = APP.activeJob;
  if (!j) return "";
  const cls = j.status === "completed" ? "completed" : ((j.status === "error" || j.status === "cancelled") ? "error" : "");
  const icon = j.status === "running" ? "&#9889;" : (j.status === "completed" ? "&#9989;" : "&#9209;");
  const stopBtn = j.status === "running"
    ? `<button class="btn-stop" id="btn-stop-job" type="button">${j.cancelling ? "Stopping..." : "Stop"}</button>`
    : "";
  return `
    <div class="job-banner ${cls}" id="job-banner">
      <div class="job-head">
        <span>${icon} ${esc(j.message)}</span>
        <span style="display:inline-flex;align-items:center;gap:10px;">
          <span style="color:var(--muted);">${j.elapsed_sec}s</span>
          ${stopBtn}
        </span>
      </div>
      <div class="job-logs" id="job-logs-box">${esc((j.logs || []).join("\n"))}</div>
    </div>
  `;
}

function bindJobBannerActions() {
  const stopBtn = document.getElementById("btn-stop-job");
  if (stopBtn && APP.activeJob) {
    stopBtn.addEventListener("click", async () => {
      try {
        await apiPost(`/api/jobs/${encodeURIComponent(APP.activeJob.job_id)}/cancel`, {});
        showToast("Stopping cleanly after current clip...");
      } catch (e) { showToast(e.message); }
    });
  }
}

function startPollingJob(jobObj) {
  APP.activeJob = jobObj;
  renderMain();
  if (APP.pollTimer) clearInterval(APP.pollTimer);
  APP.pollTimer = setInterval(async () => {
    try {
      const updated = await apiGet(`/api/jobs/${APP.activeJob.job_id}`);
      APP.activeJob = updated;
      const banner = document.getElementById("job-banner");
      if (banner) {
        banner.outerHTML = renderJobBannerHtml();
        bindJobBannerActions();
        const lb = document.getElementById("job-logs-box");
        if (lb) lb.scrollTop = lb.scrollHeight;
      } else {
        renderMain();
      }
      if (updated.status !== "running") {
        clearInterval(APP.pollTimer);
        APP.pollTimer = null;
        await loadProjectsList();
        if ((updated.status === "completed" || updated.status === "cancelled") && updated.project_name && updated.project_name !== "auto") {
          showToast(updated.status === "completed" ? "Your Viral Shorts are ready!" : "Stopped cleanly.");
          await openProject(updated.project_name, "outputs");
        }
      }
    } catch (_) {}
  }, 1400);
}

function startHeroWordRotation() {
  if (APP.heroTimer) {
    clearInterval(APP.heroTimer);
    APP.heroTimer = null;
  }
  const words = Array.from(document.querySelectorAll(".hero-word"));
  if (!words.length) return;

  let activeIdx = 0;
  function applyState() {
    words.forEach((el, idx) => {
      el.classList.remove("is-active", "is-past", "is-future");
      if (idx === activeIdx) el.classList.add("is-active");
      else if (idx < activeIdx) el.classList.add("is-past");
      else el.classList.add("is-future");
    });
  }
  applyState();

  APP.heroTimer = setInterval(() => {
    activeIdx = (activeIdx + 1) % words.length;
    applyState();
  }, 2100);
}

      <div class="studio-dock">

    preset: document.getElementById("f-cap-preset").value,
    color: document.getElementById("f-cap-color").value,

    maxClips: document.getElementById("f-max-clips").value,

    mirrorState.textContent = mirrorCb.checked ? "ON" : "OFF";

    const src = document.getElementById("f-source").value.trim();
    if (!src) {

      document.getElementById("f-source").focus();
      return;
    }
    try {
      const rawMax = parseInt(document.getElementById("f-max-clips").value, 10);

        source: src,
        caption_preset: document.getElementById("f-cap-preset").value,

  document.getElementById("btn-start-auto").addEventListener("click", triggerAutopilot);

}

function renderProjectView() {
  const p = APP.currentProject;
  if (!p) return;
  const meta = p.metadata || {};
  document.getElementById("view-title").textContent = `${p.state.person || p.name}`;
  document.getElementById("view-sub").textContent = `${meta.title || p.state.source}`;

  const tabsEl = document.getElementById("project-tabs");
  tabsEl.style.display = "flex";
  tabsEl.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === APP.tab);
    if (b.dataset.tab === "outputs") {
      b.textContent = `Rendered Shorts (${(p.outputs || []).length})`;
    } else {
      b.textContent = `Clips & Hooks (${(p.candidates || []).length})`;
    }
  });

  if (APP.tab === "review") renderReviewTab(p);
  else renderOutputsTab(p);
}

function renderReviewTab(p) {
  const decisions = (p.decisions && p.decisions.decisions) || {};
  const stateMap = {};
  for (const c of p.candidates) {
    const existing = decisions[c.id];
    const variants = (c.hooks && c.hooks.variants) || [];
    const selIdx = existing ? existing.selected_hook_index : ((c.hooks && c.hooks.selected_index) || 0);
    const defaultHook = variants[selIdx] ? variants[selIdx].text : "";
    stateMap[c.id] = {
      clip_id: c.id,
      approved: existing ? !!existing.approved : (!c.rejected_by_quality && c.score >= p.auto_threshold),
      selected_hook_index: selIdx,
      edited_hook_text: (existing && existing.edited_hook_text) || defaultHook,
    };
  }

  async function persistDecisions() {
    await apiPost(`/api/projects/${encodeURIComponent(p.name)}/decisions`, {
      project_name: p.name,
      decisions: stateMap,
    });
  }

  document.getElementById("content").innerHTML = `
    ${renderJobBannerHtml()}
    <div class="enhance-panel">
      <div class="enhance-panel-head">
        <div class="enhance-panel-title"><span class="neon-dot"></span>Caption Position, Face Tracking &amp; Render Studio</div>
        <button class="shiny-cta shiny-coral" id="btn-render-approved" type="button" style="padding:0.72rem 1.45rem; font-size:0.88rem;">
          <span>Render Approved Shorts &rarr;</span>
        </button>
      </div>
      <div class="enhance-grid">
        <div class="opt-field">
          <label for="r-cap-preset">Caption Style</label>
          <select id="r-cap-preset">
            <option value="iman" selected>Iman Gadzhi Kinetic</option>
            <option value="hormozi">Alex Hormozi Impact</option>
            <option value="documentary">Documentary Editorial</option>
            <option value="neon">Neon Bold</option>
            <option value="comic">Comic Punch</option>
            <option value="minimal">Clean Minimal</option>
          </select>
        </div>
        <div class="opt-field">
          <label for="r-cap-color">Caption Color</label>
          <select id="r-cap-color">
            <option value="purple" selected>Neon Purple (Default)</option>
            <option value="yellow">Luxury Gold / Yellow</option>
            <option value="red">Viral Crimson Red</option>
          </select>
        </div>
        <div class="opt-field">
          <label for="r-cap-position">Caption Position</label>
          <select id="r-cap-position">
            ${CAPTION_POSITION_OPTIONS_HTML}
          </select>
        </div>
        <div class="opt-field">
          <label for="r-filter-1">Quality Filter 1</label>
          <select id="r-filter-1">
            ${FILTER_OPTIONS_HTML}
          </select>
        </div>
        <div class="opt-field">
          <label for="r-filter-2">Quality Filter 2</label>
          <select id="r-filter-2">
            ${FILTER_OPTIONS_HTML}
          </select>
        </div>
        <label class="toggle-chip" id="r-mirror-chip" style="justify-content:space-between; height:36px;">
          <span style="display:inline-flex;align-items:center;gap:7px;">
            <input type="checkbox" id="r-mirror-video" />
            Mirror Video
          </span>
          <span class="toggle-state" id="r-mirror-state">OFF</span>
        </label>
      </div>
    </div>
    <div class="cards-grid" id="rev-cards"></div>
  `;

  bindJobBannerActions();
  const rPrefs = loadPrefs();
  document.getElementById("r-cap-preset").value = rPrefs.preset || "iman";
  document.getElementById("r-cap-color").value = rPrefs.color || "purple";
  document.getElementById("r-cap-position").value = rPrefs.position || "bottom";
  document.getElementById("r-filter-1").value = rPrefs.filter1 || "";
  document.getElementById("r-filter-2").value = rPrefs.filter2 || "";

  const rMirrorCb = document.getElementById("r-mirror-video");
  const rMirrorChip = document.getElementById("r-mirror-chip");
  const rMirrorState = document.getElementById("r-mirror-state");
  rMirrorCb.checked = !!rPrefs.mirror;
  rMirrorChip.classList.toggle("is-on", rMirrorCb.checked);
  rMirrorState.textContent = rMirrorCb.checked ? "ON" : "OFF";
  const persistRevPrefs = () => savePrefs({
    preset: document.getElementById("r-cap-preset").value,
    color: document.getElementById("r-cap-color").value,
    position: document.getElementById("r-cap-position").value,
    filter1: document.getElementById("r-filter-1").value,
    filter2: document.getElementById("r-filter-2").value,
    mirror: rMirrorCb.checked,
  });
  ["r-cap-preset", "r-cap-color", "r-cap-position", "r-filter-1", "r-filter-2"].forEach(id => {
    document.getElementById(id).addEventListener("change", persistRevPrefs);
  });
  rMirrorCb.addEventListener("change", () => {
    rMirrorChip.classList.toggle("is-on", rMirrorCb.checked);
    rMirrorState.textContent = rMirrorCb.checked ? "ON" : "OFF";
    persistRevPrefs();
  });

  function drawCards() {
    const grid = document.getElementById("rev-cards");
    grid.innerHTML = p.candidates.map(c => {
      const st = stateMap[c.id];
      const variants = (c.hooks && c.hooks.variants) || [];
      const opts = variants.map((v, i) => `<option value="${i}" ${i === st.selected_hook_index ? "selected" : ""}>#${v.rank} (${v.predicted_retention}%) ${esc(v.text)}</option>`).join("");
      return `
        <article class="card ${st.approved ? "approved" : "rejected"}">
          <div class="card-top">
            <div class="thumb-wrap">
              ${c.thumbnail_url ? `<img src="${esc(c.thumbnail_url)}" alt="${esc(c.id)}" />` : ""}
              <div class="score-badge">${c.score}/100</div>
              <div class="time-badge">${fmtTime(c.start)}-${fmtTime(c.end)} (${c.duration}s)</div>
            </div>
            <div>
              <div style="font-weight:800; color:var(--sky-bright); font-size:14px;">${esc(c.id.toUpperCase())}</div>
              <div style="font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45;">${esc(c.reason)}</div>
              <div class="quote">"${esc(c.key_quote)}"</div>
            </div>
          </div>
          <div class="hook-section">
            <input type="text" id="hk-${c.id}" value="${esc(st.edited_hook_text)}" style="font-weight:700;" />
            ${opts ? `<select id="vr-${c.id}" style="margin-top:8px;">${opts}</select>` : ""}
          </div>
          <div class="card-actions">
            <button class="btn-approve ${st.approved ? "active" : ""}" id="ap-${c.id}" type="button">Approve</button>
            <button class="btn-reject ${!st.approved ? "active" : ""}" id="rj-${c.id}" type="button">Reject</button>
          </div>
        </article>
      `;
    }).join("");

    for (const c of p.candidates) {
      const st = stateMap[c.id];
      document.getElementById(`ap-${c.id}`).addEventListener("click", async () => { st.approved = true; drawCards(); await persistDecisions(); });
      document.getElementById(`rj-${c.id}`).addEventListener("click", async () => { st.approved = false; drawCards(); await persistDecisions(); });
      const selEl = document.getElementById(`vr-${c.id}`);
      if (selEl) {
        selEl.addEventListener("change", async ev => {
          const idx = parseInt(ev.target.value, 10) || 0;
          st.selected_hook_index = idx;
          if (c.hooks.variants[idx]) { st.edited_hook_text = c.hooks.variants[idx].text; drawCards(); }
          await persistDecisions();
        });
      }
      document.getElementById(`hk-${c.id}`).addEventListener("input", async ev => {
        st.edited_hook_text = ev.target.value;
        await persistDecisions();
      });
    }
  }

  drawCards();

  document.getElementById("btn-render-approved").addEventListener("click", async () => {
    await persistDecisions();
    try {
      const rFilters = [
        document.getElementById("r-filter-1").value,
        document.getElementById("r-filter-2").value,
      ].filter(Boolean);
      const job = await apiPost("/api/jobs/render", {
        name: p.name,
        force: true,
        hook_enabled: false,
        show_opening_title: false,
        caption_preset: document.getElementById("r-cap-preset").value,
        active_color: document.getElementById("r-cap-color").value,
        caption_position: document.getElementById("r-cap-position").value,
        mirror_video: document.getElementById("r-mirror-video").checked,
        video_filters: rFilters,
      });
      startPollingJob(job);
    } catch (e) { showToast(e.message); }
  });
}
