# ShortsForge Configuration
# All paths are resolved relative to the project root unless absolute.
# API keys belong in .env (never in this file).

paths:
  projects_dir: "projects"
  outputs_dir: "outputs"
  fonts_dir: "" # Optional custom directory of .ttf/.otf fonts; auto-discovers OS fonts if blank

ingest:
  max_video_height: 1080 # Caps downloads at 1080p (fast downloads, crisp 9:16 output, avoids huge 4K AV1 files)
  prefer_h264: true # Strongly prefer H.264/MP4 for fast OpenCV face-tracking & ffmpeg slicing
  concurrent_fragments: 4
  retries: 10
  cookies_from_browser: "" # Optional: "chrome" | "edge" | "firefox" for age-restricted videos

llm:
  provider: "gemini" # "gemini" | "claude" | "mock"
  gemini_model: "gemini-2.5-flash"
  claude_model: "claude-3-5-sonnet-latest"
  temperature: 0.3
  max_retries: 2
  cache_enabled: true

tts:
  provider: "edge" # "edge" | "openai" | "offline"
  # Generic neutral narrator voice (NEVER clones or mimics the subject's voice)
  edge_voice: "en-US-AndrewNeural"
  openai_voice: "onyx"
  rate: "+4%"

transcription:
  model_size: "small" # "tiny" | "base" | "small" | "medium" | "large-v3"
  device: "auto" # "auto" | "cpu" | "cuda"
  compute_type: "auto" # "auto" | "int8" | "float16"
  language: null # null = auto-detect, or ISO code like "en"
  vad_filter: true
  speaker_turn_pause_sec: 1.6

moments:
  max_candidates: 10
  min_duration_sec: 20.0
  max_duration_sec: 55.0
  window_minutes: 18
  window_overlap_minutes: 2
  scoring_weights:
    emotional_peak: 0.25
    quotable_statement: 0.25
    humor_payoff: 0.15
    self_contained: 0.20
    clean_boundaries: 0.15

quality_check:
  enabled: true
  sample_fps: 0.5
  min_face_presence_ratio: 0.30 # Reject if speaker face is off-camera below this ratio
  max_graphics_ratio: 0.70 # Reject if scene is predominantly flat graphics/slides
  min_audio_rms_db: -42.0
  max_clipping_ratio: 0.05
  min_estimated_snr_db: 6.0

hook:
  style: "cold_open" # "cold_open" | "freeze_narrator"
  variants_count: 5
  max_words: 9
  cold_open_min_sec: 2.0
  cold_open_max_sec: 3.0
  freeze_duration_sec: 2.8
  freeze_zoom_end: 1.12
  transition_duration_sec: 0.28
  max_verification_attempts: 3
  deceased_subject: false # Enables extra respectful-tone guardrails for deceased figures

reframe:
  output_width: 1080
  output_height: 1920
  output_fps: 30
  face_smoothing_alpha: 0.12 # Lower = smoother camera movement
  deadzone_ratio: 0.05
  max_pan_speed_px_per_sec: 380.0
  two_person_layout: "split" # "split" | "blurred_fit"
  four_by_three_zoom: 1.06 # 1.0 = no zoom, >1.0 = subtle gentle zoom on centered 4:3 frame
  scene_threshold: 27.0
  enhance_old_footage: false # Light ffmpeg denoise + lanczos upscale + subtle sharpen (no AI face alteration)

captions:
  preset: "neon" # "neon" | "comic" | "minimal"
  words_per_group: 3 # 1-3 words per caption event
  font_name: "" # Leave blank to auto-select ultra-bold display font (Arial Black / Montserrat Black / Impact)
  font_size: 94
  emphasis_scale: 1.28
  active_color: "yellow" # "yellow" | "red"
  safe_margin_left: 80
  safe_margin_right: 160
  safe_margin_bottom: 360

overlays:
  lower_third_duration_sec: 4.0
  archive_tag: false # "FROM THE ARCHIVE" badge style option
  closing_card_text: "Follow for more"
  closing_card_duration_sec: 0.85 # Must remain < 1.0s

audio:
  target_lufs: -14.0
  true_peak_db: -1.5
  lra: 11.0
  hook_bed_enabled: true
  hook_bed_path: "" # Optional custom audio file; uses clean synthesized ambient bed if blank
  hook_bed_volume_db: -22.0
  transition_sfx_path: "" # Optional custom whoosh/rewind SFX; uses clean synthesized SFX if blank
  transition_sfx_volume_db: -10.0

review:
  auto_score_threshold: 75
  server_port: 8765

export:
  video_crf: 20
  video_preset: "medium"
  audio_bitrate: "192k"
  rights_note: "Verify licensing/fair-use permissions for original broadcast footage before publishing."
